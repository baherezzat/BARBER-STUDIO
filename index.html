<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE GENTLEMAN — حلاقة رجالية فاخرة | حجز زيارات منزلية وباقات العريس</title>
<meta name="description" content="صالون حلاقة رجالي فاخر في مصر — احجز موعدك داخل الصالون أو زيارة منزلية أو باقة تجهيز عريس، مع أحدث قصات الشعر العالمية.">
<meta property="og:title" content="THE GENTLEMAN — BARBER STUDIO">
<meta property="og:description" content="حلاقة على أصولها. احجز الآن عبر واتساب.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://images.unsplash.com/photo-1672257493461-704902362c1d?w=1440&amp;fit=max&amp;q=85&amp;fm=webp">
<link rel="icon" href="assets/icons/scissors.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="atelier.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a href="#home" class="brand" data-nav>
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="7" r="2.6"/><circle cx="6" cy="17" r="2.6"/><path d="M8.3 8.3 20 19M8.3 15.7 20 5"/></svg>
      </span>
      <span class="brand-text"><strong data-i18n="brandName">ذا جنتلمان</strong><small data-i18n="brandSub">BARBER STUDIO</small></span>
    </a>
    <nav class="main-nav" id="mainNav" aria-label="Main">
      <a href="#home" data-nav data-i18n="navHome">الرئيسية</a>
      <a href="#services" data-nav data-i18n="navServices">خدماتنا</a>
      <a href="#haircuts" data-nav data-i18n="navHaircuts">أحدث القصات</a>
      <a href="#contact" data-nav data-i18n="navContact">اتصل بنا</a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">EN</button>
      <button class="btn btn-gold btn-header" data-open-booking data-i18n="btnBookNow">احجز موعدك الآن</button>
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<!-- Mobile drawer -->
<div class="nav-drawer" id="navDrawer" aria-hidden="true">
  <nav class="drawer-links">
    <a href="#home" data-nav data-i18n="navHome">الرئيسية</a>
    <a href="#services" data-nav data-i18n="navServices">خدماتنا</a>
    <a href="#haircuts" data-nav data-i18n="navHaircuts">أحدث القصات</a>
    <a href="#contact" data-nav data-i18n="navContact">اتصل بنا</a>
  </nav>
  <button class="btn btn-gold btn-block" data-open-booking data-i18n="btnBookNow">احجز موعدك الآن</button>
</div>

<main id="main">

<!-- ================= HERO ================= -->
<section class="booking-entry" id="home" data-mode="salon">
  <div class="session-photo" aria-hidden="true"><img id="bookingPhoto" alt="" fetchpriority="high" sizes="(max-width: 740px) 100vw, 64vw" src="https://images.unsplash.com/photo-1672257493461-704902362c1d?w=1440&amp;fit=max&amp;q=85&amp;fm=webp" srcset="https://images.unsplash.com/photo-1672257493461-704902362c1d?w=768&amp;fit=max&amp;q=85&amp;fm=webp 768w, https://images.unsplash.com/photo-1672257493461-704902362c1d?w=1440&amp;fit=max&amp;q=85&amp;fm=webp 1440w, https://images.unsplash.com/photo-1672257493461-704902362c1d?w=2400&amp;fit=max&amp;q=85&amp;fm=webp 2400w, https://images.unsplash.com/photo-1672257493461-704902362c1d?w=3840&amp;fit=max&amp;q=85&amp;fm=webp 3840w"></div>
  <div class="session-copy">
    <div class="session-brand" lang="en" dir="ltr">The Gentleman</div>
    <h1 data-i18n="bkTitle">احجز موعدك</h1>
    <div class="session-modes" role="group" aria-label="Booking options">
      <button type="button" data-mode-choice="salon" aria-pressed="true" data-i18n="typeSalon">داخل الصالون</button>
      <button type="button" data-mode-choice="home" aria-pressed="false" data-i18n="typeHome">زيارة منزلية</button>
      <button type="button" data-mode-choice="groom" aria-pressed="false" data-i18n="typeGroom">تجهيز العريس</button>
    </div>
    <button class="btn btn-gold session-book" data-open-booking data-booking-type="salon" data-i18n="pickService">اختار الخدمة والموعد</button>
  </div>
</section>
<div class="compact-menu container">
<details id="services" class="compact-panel"><summary><span data-i18n="servicesEyebrow">الخدمات والأسعار</span></summary><div class="panel-content">
    <div class="filter-bar" id="serviceFilters" role="tablist"></div>
    <div class="services-grid" id="servicesGrid"></div>
  </div></details>
<details id="haircuts" class="compact-panel"><summary><span data-i18n="haircutsTitle">القصّات</span></summary><div class="panel-content">
    <div class="haircuts-gallery" id="haircutsGallery"></div>
  </div></details>
<details id="contact" class="compact-panel"><summary><span data-i18n="contactTitle">اتصل بنا</span></summary><div class="panel-content">
    <div class="contact-grid" id="contactGrid"></div>
  </div></details>
</div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <strong>THE GENTLEMAN</strong>
      <p data-i18n="slogan">أناقتك تبدأ من هنا... أينما كنت.</p>
    </div>
    <div class="footer-social" id="footerSocial"></div>
    <p class="footer-copy">© 2026 THE GENTLEMAN — <span data-i18n="footerNote">جميع الحقوق محفوظة</span></p>
  </div>
</footer>

<!-- ================= MOBILE BOTTOM BAR ================= -->
<nav class="mobile-bar" aria-label="Quick actions">
  <a href="#services" data-nav>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span data-i18n="barServices">الخدمات</span></a>
  <a href="#contact" data-nav>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
    <span data-i18n="barContact">اتصل بنا</span></a>
  <a id="mobileWhatsApp" target="_blank" rel="noopener" class="mb-wa">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .3-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5s.8 1.9.8 2c.1.1.1.3 0 .5l-.4.6c-.1.2-.3.4-.1.7.1.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.5.1.6-.1s.7-.8.9-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.5.2.5.3 0 .1 0 .7-.4 1.3Z"/></svg>
    <span>WhatsApp</span></a>
  <button class="mb-book" data-open-booking>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
    <span data-i18n="barBook">احجز الآن</span></button>
</nav>

<!-- ================= BOOKING MODAL ================= -->
<div class="modal" id="bookingModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="bookingTitle">
  <div class="modal-backdrop" data-close-booking></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="bookingTitle" data-i18n="bkTitle">احجز موعدك</h3>
      <button class="modal-close" data-close-booking aria-label="Close">&times;</button>
    </div>
    <ol class="bk-steps" id="bkSteps"></ol>
    <div class="bk-body" id="bkBody"></div>
    <div class="bk-foot" id="bkFoot"></div>
  </div>
</div>

<!-- ================= LIGHTBOX ================= -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
  <button class="lb-close" data-close-lightbox aria-label="Close">&times;</button>
  <button class="lb-prev" id="lbPrev" aria-label="Previous">&#10094;</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lb-next" id="lbNext" aria-label="Next">&#10095;</button>
</div>

<script src="config.js"></script>
<script src="studio-media.js"></script>
<script src="script.js"></script>
</body>
</html>
